name: Build blog
on:
  push:
    branches: [main]
    paths: ['content/**', 'site.json', 'build.py', 'requirements.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python build.py
      - name: Save generated pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist
          git diff --staged --quiet || git commit -m 'Rebuild blog pages'
          git push
